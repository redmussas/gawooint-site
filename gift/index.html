<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일상추천 | 링크</title>
<meta name="description" content="직접 써보고 고른 제품 링크 모음">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111;--sub:#8a8a8a;--line:#ececec;--bg:#fff;--accent:#111;--lime:#d9ff2e;--radius:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f4f4f5;color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .page{max-width:480px;margin:0 auto;background:var(--bg);min-height:100dvh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .cover{width:100%;aspect-ratio:900/825;object-fit:cover;display:block;background:#fff}
  .cover.none{aspect-ratio:3/1}
  .head{text-align:center;padding:0 20px 8px;margin-top:-44px;position:relative}
  .avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#eee;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .name{font-size:20px;font-weight:900;margin-top:8px;letter-spacing:-.3px}
  .bio{font-size:13.5px;color:#444;line-height:1.55;margin-top:6px;white-space:pre-line}
  .socials{display:flex;justify-content:center;gap:14px;margin-top:14px}
  .socials a{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff;transition:.15s}
  .socials a:hover{transform:translateY(-2px);border-color:#bbb}
  .socials svg{width:20px;height:20px;fill:#222}
  .biz{display:block;margin:18px 20px 0;text-align:center;padding:14px;border-radius:var(--radius);background:#111;color:var(--lime);font-weight:700;font-size:14.5px}
  .sec{padding:26px 20px 0}
  .sec h2{display:inline-block;font-size:13px;color:#111;font-weight:900;letter-spacing:.3px;margin-bottom:12px;background:linear-gradient(transparent 45%,var(--lime) 45%,var(--lime) 90%,transparent 90%);padding:0 2px}
  .links{display:flex;flex-direction:column;gap:10px}
  .link{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.03);transition:.15s;position:relative}
  .link:hover{border-color:#c9c9c9;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .num{flex:none;font-size:11px;font-weight:900;color:#111;background:var(--lime);border-radius:7px;padding:3px 6px;min-width:30px;text-align:center;letter-spacing:.3px}
  .thumb{flex:none;width:46px;height:46px;border-radius:10px;object-fit:cover;background:#f1f1f1}
  .ttl{flex:1;min-width:0;font-size:14.5px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ttl small{display:block;color:var(--sub);font-size:12px;font-weight:400;margin-top:2px}
  .arrow{flex:none;color:#bbb}
  .tag{position:absolute;top:-8px;left:12px;background:#111;color:var(--lime);font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:999px}
  .notice{margin:30px 20px 0;font-size:11.5px;color:#9a9a9a;line-height:1.6;text-align:center}
  .made{margin-top:14px;text-align:center;font-size:11px;color:#c0c0c0}
</style>
</head>
<body>
<div class="page">
  <img class="cover" id="cover" alt="">
  <header class="head">
    <img class="avatar" id="avatar" alt="">
    <h1 class="name" id="name"></h1>
    <p class="bio" id="bio"></p>
    <nav class="socials" id="socials"></nav>
    <a class="biz" id="biz" rel="noopener"></a>
  </header>

  <section class="sec">
    <h2 id="listTitle"></h2>
    <div class="links" id="links"></div>
  </section>

  <p class="notice" id="notice"></p>
  <p class="made">© <span id="year"></span> <span id="nameFoot"></span></p>
</div>

/* ============================================================ */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

document.title = CONFIG.name + " | 링크";
const cover = $("cover");

$("avatar").src = CONFIG.avatar || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>";

$("bio").textContent = CONFIG.bio || "";
$("socials").innerHTML = (CONFIG.socials || []).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.type)}">${ICONS[s.type] || ICONS.blog}</a>`).join("");

$("listTitle").textContent = CONFIG.listTitle || "";
const n = CONFIG.links.length, pad = n >= 100 ? 3 : 2;
$("links").innerHTML = CONFIG.links.map((l, i) => `
  <a class="link" href="${esc(l.url)}" target="_blank" rel="noopener sponsored">
    ${l.tag ? `<span class="tag">${esc(l.tag)}</span>` : ""}
