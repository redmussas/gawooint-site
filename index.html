<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAWOO INTERNATIONAL</title>
<meta name="description" content="We specialize in intermediary trade between Korea and the CIS region.">
<meta property="og:title" content="GAWOO INTERNATIONAL">
<meta property="og:description" content="We specialize in intermediary trade between Korea and the CIS region.">
<meta property="og:url" content="https://www.gawooint.com/">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta property="og:image" content="https://www.gawooint.com/images/logo.png">
<link rel="canonical" href="https://www.gawooint.com/">
<link rel="alternate" hreflang="ko" href="https://www.gawooint.com/?lang=ko">
<link rel="alternate" hreflang="en" href="https://www.gawooint.com/?lang=en">
<link rel="alternate" hreflang="ru" href="https://www.gawooint.com/?lang=ru">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --indigo:#1E2A5A;
  --indigo-deep:#141C3E;
  --tile:#1C8C8C;
  --saffron:#E3A72F;
  --paper:#F4F6F9;
  --ink:#16192B;
  --muted:#5B6075;
  --line:#D9DDE6;
  --display:"Bricolage Grotesque", "Pretendard", sans-serif;
  --body:"Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* Header */
.top{position:absolute;inset:0 0 auto 0;z-index:10;color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em;text-decoration:none}
.brand span{color:var(--saffron)}
.nav{display:flex;gap:28px;list-style:none}
.nav a{text-decoration:none;font-size:15px;opacity:.85}
.nav a:hover{opacity:1}
.menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}

/* Hero */
.hero{background:var(--indigo);color:#fff;position:relative;overflow:hidden;padding:150px 0 0}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,88px);line-height:1.02;letter-spacing:-.02em;max-width:13ch}
.hero p.lead{margin-top:24px;font-size:clamp(17px,2vw,20px);max-width:36ch;color:#C9D0E6}
.hero .cta{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none}
.btn-primary{background:var(--saffron);color:var(--indigo-deep)}
.btn-ghost{border:1px solid rgba(255,255,255,.35);color:#fff}
.btn:hover{filter:brightness(1.07)}

.worldmap{margin-top:56px;position:relative}
.worldmap svg{width:100%;height:auto;display:block;overflow:visible}
#wmDots circle{fill:#34427A}
.wm-arc{fill:none;stroke:var(--saffron);stroke-width:1.6;stroke-linecap:round;opacity:.9}
.wm-arc.drawn{stroke-dasharray:4 5;transition:none}
.wm-run{fill:#FFE3A3}
.wm-city circle.pt{fill:#fff}
.wm-city circle.pulse{fill:none;stroke:#fff;stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center}
.wm-city.on circle.pulse{animation:wmPulse 2.6s ease-out infinite}
@keyframes wmPulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.wm-city text{fill:#fff;font-family:var(--display);font-weight:700;font-size:var(--wm-fs,14px);paint-order:stroke;stroke:var(--indigo);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .5s}
.wm-city text.sub{fill:#9AA4C8;font-family:var(--body);font-weight:500;font-size:var(--wm-fs2,11px)}
.wm-city.on text{opacity:1}
.wm-hub circle.pt{fill:var(--saffron)}
.wm-hub text{fill:var(--saffron);opacity:1}
@media (prefers-reduced-motion:reduce){.wm-city.on circle.pulse{animation:none}.wm-city text{transition:none}}
.hero-foot{background:var(--indigo-deep);margin-top:-2px}
.hero-foot .wrap{display:flex;gap:40px;flex-wrap:wrap;padding-top:22px;padding-bottom:22px;color:#AEB6D3;font-size:15px}
.hero-foot strong{color:#fff;font-weight:600;margin-right:8px}

/* Sections */
section.block{padding:110px 0}
.block h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.4vw,52px);line-height:1.1;letter-spacing:-.015em}
.block .kr{display:block;font-family:var(--body);font-size:16px;font-weight:500;color:var(--tile);letter-spacing:0;margin-top:10px}

/* About */
.about-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center;margin-top:48px}
.about-photo{border-radius:4px 40px 4px 4px;overflow:hidden;background:var(--line);aspect-ratio:4/3}
.about-photo img{width:100%;height:100%;object-fit:cover}
.about-text p{color:var(--muted);max-width:44ch}
.about-text p+p{margin-top:16px}
.about-text .big{font-size:22px;line-height:1.5;color:var(--ink);font-weight:500}
.sign{margin-top:28px;display:flex;align-items:center;gap:14px}
.sign b{font-size:17px}
.sign small{color:var(--muted);font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:64px}
.gallery figure{aspect-ratio:16/10;overflow:hidden;border-radius:4px;background:var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover}

/* Business */
.biz{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.biz-grid{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.biz-card{margin:0;display:block;width:100%;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.biz-card .ph{aspect-ratio:4/3;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.biz-card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.biz-card .ph.fit img{object-fit:contain;padding:12px}
.biz-card .count{position:absolute;right:8px;bottom:8px;background:rgba(20,28,62,.82);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.biz-card .cap{display:block;margin-top:12px;padding-left:12px;border-left:3px solid var(--tile)}
.biz-card b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.3}
.biz-card .cap span{font-size:15px;color:var(--muted)}
.biz-card:hover .ph{border-color:var(--tile)}
.biz-card:hover .ph img{transform:scale(1.03)}
@media (prefers-reduced-motion:reduce){.biz-card .ph img{transition:none}}


/* Business thumbnails */
.biz-card.th{position:relative;display:block;aspect-ratio:16/11;border-radius:8px;overflow:hidden;background:var(--indigo);color:#fff;isolation:isolate;box-shadow:0 1px 0 rgba(20,28,62,.06)}
.th .th-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s ease}
.th::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(16,22,52,.55) 0%,rgba(16,22,52,0) 20%,rgba(16,22,52,0) 30%,rgba(16,22,52,.82) 50%,rgba(16,22,52,.96) 66%,rgba(16,22,52,.98) 100%)}
.th:hover .th-img{transform:scale(1.05)}
.th-top{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.th-tag{min-width:0;flex:0 1 auto;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.95);color:var(--indigo);padding:3px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-mark{flex:none;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.02em;color:#fff;opacity:.92;white-space:nowrap}
.th-mark i{font-style:normal;color:var(--saffron)}
.th-bottom{position:absolute;left:16px;right:16px;bottom:14px}
.th-head{display:flex;align-items:center;gap:12px}
.th-icon{flex:none;width:48px;height:48px;border-radius:12px;background:var(--saffron);color:var(--indigo-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.th-icon svg{width:32px;height:32px}
.th-names{min-width:0;display:flex;flex-direction:column}
.th-name{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.1vw,28px);line-height:1.08;letter-spacing:-.01em;color:#fff}
.th-sub{font-size:13px;font-weight:600;color:var(--saffron);margin-top:3px;letter-spacing:.01em}
.th-line{display:block;font-size:14px;color:#E1E6F5;margin-top:10px;line-height:1.45}
.th-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.2);font-size:12.5px;color:#AEB6D3}
.th-more{color:#fff;font-weight:600}
.th:hover .th-more,.th:focus-visible .th-more{color:var(--saffron)}
.th-svc{background:var(--indigo) radial-gradient(circle at 85% 15%,rgba(28,140,140,.5),transparent 55%)}
.th-svc::before{background:none}
.th-svc-list{position:absolute;left:18px;right:18px;top:50px;display:flex;flex-direction:column;gap:6px}
.th-svc-list span{font-size:clamp(16px,1.6vw,19px);font-weight:700;padding-left:11px;border-left:3px solid var(--saffron);line-height:1.2}
@media (max-width:700px){
  .biz-card.th{aspect-ratio:3/4}
  .biz-card.th-svc{grid-column:1/-1;aspect-ratio:16/8}
  .th-top{left:10px;right:10px;top:9px}
  .th-mark{display:none}
  .th-tag{font-size:11px;max-width:100%}
  .th-bottom{left:11px;right:11px;bottom:10px}
  .th-head{gap:8px}
  .th-icon{width:32px;height:32px;border-radius:8px}.th-icon svg{width:21px;height:21px}
  .th-name{font-size:17px}.th-sub{font-size:11.5px}.th-line{font-size:12px;margin-top:6px}
  .th-meta{font-size:11px;margin-top:7px;padding-top:7px}
  .th-more{display:none}
  .th-svc .th-head{flex-direction:row;align-items:center}
  .th-svc-list{left:12px;top:42px;gap:6px}.th-svc-list span{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.th .th-img{transition:none}}

/* Product detail */
dialog.detail{margin:auto;border:0;padding:0;width:min(1080px,100% - 24px);max-height:calc(100% - 24px);border-radius:8px;background:#fff;color:var(--ink);box-shadow:0 24px 60px rgba(20,28,62,.35)}
dialog.detail::backdrop{background:rgba(20,28,62,.72)}
.detail-head{position:sticky;top:0;z-index:2;background:var(--indigo);color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px clamp(18px,4vw,36px)}
.detail-head .cat{font-size:14px;color:var(--saffron)}
.detail-head h3{font-family:var(--display);font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.1;margin-top:2px}
.detail-head p{margin-top:8px;color:#C9D0E6;white-space:pre-line;font-size:16px;line-height:1.55}
.close{flex:none;background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.close:hover{background:rgba(255,255,255,.22)}
.detail-body{padding:24px clamp(18px,4vw,36px) 36px}
.detail-body h4{font-size:16px;font-weight:700;margin:6px 0 12px;color:var(--muted)}
.videos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:28px}
.videos iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px;background:#000}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.photos button{border:1px solid var(--line);border-radius:4px;padding:0;background:var(--paper);aspect-ratio:1;overflow:hidden;cursor:zoom-in}
.photos img{width:100%;height:100%;object-fit:cover}
.detail-cta{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.detail-cta .btn-primary{color:var(--indigo-deep)}
.detail-cta .btn-line{border:1px solid var(--line);color:var(--ink)}


/* Consulting card & popup */
.biz-card .ph.svc-ph{background:var(--indigo);border-color:var(--indigo);flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px}
.svc-list{display:flex;flex-direction:column;gap:6px}
.svc-list span{color:#fff;font-size:clamp(17px,1.8vw,21px);font-weight:700;line-height:1.2;padding-left:12px;border-left:3px solid var(--saffron)}
.svc-mark{font-size:13px;color:var(--saffron)}
.biz-card.svc-card:hover .ph{border-color:var(--saffron)}
.svc-items{list-style:none;counter-reset:svc;display:grid;gap:22px;margin-bottom:28px}
.svc-items li{counter-increment:svc;display:grid;grid-template-columns:44px 1fr;column-gap:14px}
.svc-items li::before{content:counter(svc);grid-row:span 2;width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--tile);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}
.svc-items h4{margin:4px 0 6px;color:var(--ink);font-size:19px;line-height:1.4}
.svc-items h4 span{display:block;font-family:var(--display);font-weight:500;font-size:14px;color:var(--muted)}
.svc-items p{color:var(--muted);font-size:16px;max-width:62ch}
.tradeit{display:grid;grid-template-columns:1fr auto;gap:20px 32px;align-items:end;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--tile);border-radius:4px;padding:22px clamp(18px,3vw,28px)}
.ti-kicker{font-size:14px;font-weight:600;color:var(--tile)}
.tradeit h4{margin:4px 0 10px;color:var(--ink);font-size:20px;line-height:1.4}
.tradeit ul{padding-left:18px;color:var(--ink);font-size:15.5px;display:grid;gap:3px}
.ti-note{margin-top:12px;font-size:14px;color:var(--muted);max-width:60ch}
.ti-btn{background:var(--tile);color:#fff;white-space:nowrap}
@media (max-width:860px){.tradeit{grid-template-columns:1fr}.ti-btn{text-align:center}.biz-card .ph.svc-ph{padding:12px 14px}.svc-list span{font-size:16px}.svc-mark{font-size:11.5px;line-height:1.3}.svc-items li{grid-template-columns:36px 1fr;column-gap:10px}.svc-items li::before{width:30px;height:30px}}

/* Lightbox */
dialog.lightbox{border:0;padding:0;background:transparent;width:100%;height:100%;max-width:100%;max-height:100%}
dialog.lightbox::backdrop{background:rgba(10,12,24,.94)}
.lb-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 64px}
.lb-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px}
.lb-btn{position:fixed;background:rgba(255,255,255,.12);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
.lb-btn:hover{background:rgba(255,255,255,.25)}
.lb-prev{left:12px;top:50%;transform:translateY(-50%)}
.lb-next{right:12px;top:50%;transform:translateY(-50%)}
.lb-close{right:12px;top:12px}
.lb-count{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);color:#C9D0E6;font-size:14px}
@media (max-width:860px){
  .photos{grid-template-columns:repeat(3,1fr);gap:6px}
  .videos{grid-template-columns:1fr}
  .lb-wrap{padding:56px 8px}
}

/* Partners */
.partners-intro{margin-top:18px;color:var(--muted);max-width:52ch}
.pc{margin-top:40px}
.pc-view{overflow:hidden;border-top:3px solid var(--tile);border-bottom:1px solid var(--line);background:#fff}
.pc-track{list-style:none;display:flex;transition:transform .7s cubic-bezier(.6,0,.25,1)}
.pc-track li,.partner-all li{flex:0 0 calc(100% / var(--per,4));border-right:1px solid var(--line)}
.plogo{display:flex;align-items:center;justify-content:center;height:128px;padding:18px;text-decoration:none;color:inherit;position:relative}
a.plogo:hover{background:var(--paper)}
a.plogo::after{content:attr(data-hp);position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--tile);opacity:0;transition:opacity .2s}
a.plogo:hover::after,a.plogo:focus-visible::after{opacity:1}
.plogo .sp{background-repeat:no-repeat;flex:none}
.plogo img{max-width:85%;max-height:84px;object-fit:contain}
.pc-ctrl{display:flex;gap:8px;align-items:center;margin-top:14px}
.pc-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--indigo);font-size:20px;cursor:pointer}
.pc-btn:hover{border-color:var(--tile)}
.pc-all{margin-left:auto;background:none;border:0;color:var(--tile);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:6px 2px}
.partner-all{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);margin-top:20px;border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff}
.partner-all li{border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.pc-track{transition:none}}

/* Contact */
.contact{background:var(--indigo);color:#fff}
.contact h2 .kr{color:var(--saffron)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:48px}
.contact dl{display:grid;grid-template-columns:96px 1fr;row-gap:18px;font-size:17px}
.contact dt{color:#8F99BE}
.contact dd a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.contact dd a:hover{border-color:var(--saffron)}
.contact-actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.contact-actions .note{color:#AEB6D3;font-size:15px;margin-bottom:8px;max-width:36ch}

/* Footer */
footer{background:var(--indigo-deep);color:#8F99BE;font-size:14px;padding:40px 0;line-height:1.9}
footer .brand{color:#fff;font-size:18px;display:inline-block;margin-bottom:10px}
footer .row{display:flex;flex-wrap:wrap;column-gap:20px}
footer .bank{margin-top:12px}

@media (max-width:860px){
  .nav{display:none;position:absolute;top:70px;right:24px;flex-direction:column;gap:0;background:var(--indigo-deep);border-radius:10px;padding:8px 0;min-width:180px}
  .nav.open{display:flex}
  .nav a{display:block;padding:10px 20px}
  .menu-btn{display:block}
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
  .biz-grid{grid-template-columns:repeat(2,1fr);gap:24px 14px}
  .partner-all{grid-template-columns:repeat(2,1fr)}
  .plogo{height:104px;padding:12px}
  .gallery{grid-template-columns:1fr 1fr}
  .gallery figure:last-child{grid-column:1/-1}
  section.block{padding:80px 0}
}

/* Language switch */
.top-right{display:flex;align-items:center;gap:22px}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px;gap:2px}
.lang button{background:none;border:0;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;opacity:.75;line-height:1.2}
.lang button:hover{opacity:1}
.lang button[aria-pressed="true"]{background:#fff;color:var(--indigo);opacity:1}
@media (max-width:860px){.top-right{gap:8px}.lang button{padding:5px 9px;font-size:12.5px}}
@media (max-width:380px){.lang button{padding:5px 7px}}

/* Consulting detail with video */
.svc-top{display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:start;margin-bottom:28px}
.svc-top .svc-items{margin-bottom:0}
.svc-video{margin:0}
.svc-video video{width:100%;aspect-ratio:9/16;background:#0d1230;border-radius:10px;display:block;object-fit:cover}
.svc-video figcaption{font-size:13.5px;color:var(--muted);margin-top:8px;text-align:center}
@media (max-width:860px){.svc-top{grid-template-columns:1fr}.svc-video{max-width:300px;margin:0 auto}}

/* TradeIt entry popup */
dialog.promo{margin:auto;border:0;padding:0;width:min(760px,100% - 24px);max-height:calc(100% - 24px);border-radius:12px;overflow:auto;background:#fff;color:var(--ink);box-shadow:0 30px 70px rgba(10,14,32,.45)}
dialog.promo::backdrop{background:rgba(16,22,52,.66)}
.promo-grid{display:grid;grid-template-columns:1fr 230px}
.promo-main{padding:30px 30px 26px}
.promo-kicker{font-size:13.5px;font-weight:700;color:var(--tile)}
.promo h3{font-family:var(--display);font-size:clamp(23px,3vw,30px);line-height:1.2;font-weight:800;margin:6px 0 10px;letter-spacing:-.01em}
.promo-lead{color:var(--muted);font-size:15.5px;line-height:1.6}
.promo ul{margin:14px 0 0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.promo-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.promo-actions .btn{background:var(--tile);color:#fff}
.promo-later{background:none;border:0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.promo-note{margin-top:12px;font-size:12.5px;color:var(--muted)}
.promo-side{background:var(--indigo);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px 20px;text-align:center}
.promo-side img{width:170px;height:170px;border-radius:8px;background:#fff;padding:6px}
.promo-side p{font-size:13px;color:#C9D0E6;line-height:1.5}
.promo-side b{font-family:var(--display);font-size:20px;font-weight:800}
.promo-side b i{font-style:normal;color:var(--saffron)}
.promo-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer}
.promo-close:hover{background:rgba(255,255,255,.3)}
@media (max-width:640px){
  .promo-grid{grid-template-columns:1fr}
  .promo-side{order:-1;flex-direction:row;justify-content:flex-start;text-align:left;padding:18px 56px 18px 18px}
  .promo-side img{width:92px;height:92px;padding:4px}
  .promo-main{padding:20px 18px 18px}
  .promo ul{font-size:14px}
}

/* Korean line breaking & header fit */
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
.brand{white-space:nowrap}
.lang button{white-space:nowrap}
@media (max-width:860px){.brand{font-size:19px}}
@media (max-width:400px){.brand{font-size:17px}.top .wrap{gap:8px}.menu-btn{padding:6px 9px}}

/* Text wordmark for partners without a logo file */
.pword{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em;color:var(--indigo)}
@media (max-width:560px){.pword{font-size:22px}}

/* Business grid: 3 columns down to tablet, tighter cards */
.biz-grid{gap:18px}
@media (max-width:1000px){.th-line{font-size:13px}.th-name{font-size:21px}.th-icon{width:42px;height:42px}.th-icon svg{width:28px;height:28px}.th-bottom{left:13px;right:13px;bottom:11px}.th-top{left:12px;right:12px;top:10px}.th-mark{display:none}}
@media (max-width:860px) and (min-width:701px){.biz-grid{grid-template-columns:repeat(3,1fr);gap:14px}.biz-card.th{aspect-ratio:4/4.2}.th-meta .th-more{display:none}}
@media (max-width:700px){.biz-grid{grid-template-columns:repeat(2,1fr);gap:12px}}

/* Tag types: service / origin / brand / field */
.th-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px}
.th-tag .tag-k{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;line-height:1.5;flex:none}
.th-tag.tag-service{background:var(--saffron);color:var(--indigo-deep)}
.th-tag.tag-service .tag-k{background:var(--indigo-deep);color:var(--saffron)}
.th-tag.tag-origin{background:#fff;color:var(--indigo)}
.th-tag.tag-origin .tag-k{background:var(--tile);color:#fff}
.th-tag.tag-brand{background:#F1E9FF;color:#3B2A72}
.th-tag.tag-brand .tag-k{background:#6B4FC8;color:#fff}
.th-tag.tag-field{background:#E5F6E9;color:#1E5A33}
.th-tag.tag-field .tag-k{background:#2F8A4E;color:#fff}
.tag-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;font-size:13.5px;color:var(--muted)}
.tag-legend .lg{display:inline-flex;align-items:center;gap:6px}
.tag-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg-service i{background:var(--saffron)}.lg-origin i{background:var(--tile)}.lg-brand i{background:#6B4FC8}.lg-field i{background:#2F8A4E}
@media (max-width:700px){.th-tag{padding:2px 8px 2px 3px;gap:4px}.th-tag .tag-k{font-size:10px;padding:1px 5px}}

/* Consulting partner logos */
.svc-partners{margin:0 0 24px;padding:18px 0 4px;border-top:1px solid var(--line)}
.svc-partners h4{margin:0 0 12px;font-size:15px;color:var(--muted)}
.svc-logos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.svc-logo{display:flex;align-items:center;justify-content:center;height:88px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;text-decoration:none}
.svc-logo:hover{border-color:var(--tile)}
.svc-logo img{max-width:100%;max-height:58px;object-fit:contain}
.svc-logo .pword{font-size:26px}
.svc-partners p{margin-top:10px;font-size:14px;color:var(--muted)}
@media (max-width:560px){.svc-logos{gap:8px}.svc-logo{height:64px;padding:8px}.svc-logo img{max-height:40px}.svc-logo .pword{font-size:18px}}
.th-tag .tag-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Telegram button */
.btn-tg{display:inline-flex;align-items:center;gap:8px;background:#229ED9;color:#fff}
.btn-tg svg{width:20px;height:20px}
.btn-tg:hover{background:#1C8BC0}
.contact dl{align-content:start}

/* Company logo */
.top .wrap{height:92px}
.top .brand img{height:76px;width:auto;display:block}
.foot-logo img{height:84px;width:auto;display:block;margin-bottom:6px}
@media (max-width:860px){.top .wrap{height:76px}.top .brand img{height:58px}}
@media (max-width:400px){.top .brand img{height:52px}}

/* ===== Trade tools ===== */
.tools{background:var(--paper)}
#toolGroups{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tool-group{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;border-top:4px solid var(--g)}
.g-calc{--g:var(--saffron);--gs:#FFF4DC;--gi:#8A5A00}
.g-lookup{--g:var(--tile);--gs:#E2F4F4;--gi:#11605F}
.g-market{--g:#6B4FC8;--gs:#F1ECFF;--gi:#4A35A0}
.tg-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.tg-head h3{font-size:18px;font-weight:800;color:var(--ink)}
.tg-head span{font-size:12.5px;color:var(--muted);text-align:right}
.tool-grid{display:grid;grid-template-columns:1fr;gap:8px}
.tool-tile{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;color:var(--ink);text-decoration:none;cursor:pointer;transition:border-color .15s,background .15s}
.tool-tile:hover{border-color:var(--g);background:var(--gs)}
.tt-ic{flex:none;width:38px;height:38px;border-radius:9px;background:var(--gs);color:var(--gi);display:flex;align-items:center;justify-content:center}
.tt-ic svg{width:22px;height:22px}
.tt-tx{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.tt-tx b{font-size:15px;font-weight:700}
.tt-tx small{font-size:12.5px;color:var(--muted);margin-top:2px}
.tt-ext{margin-left:auto;flex:none;width:16px;height:16px;color:#9AA1B5}
.tt-ext svg{width:16px;height:16px}
.tt-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#E5484D}
@media (max-width:1000px){#toolGroups{grid-template-columns:1fr 1fr}.g-market{grid-column:1/-1}.g-market .tool-grid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){#toolGroups{grid-template-columns:1fr}.g-market .tool-grid{grid-template-columns:1fr}.tool-group{padding:14px}}

/* Tool dialog */
dialog.tooldlg{margin:auto;border:0;padding:0;width:min(860px,100% - 24px);max-height:calc(100% - 24px);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 24px 60px rgba(20,28,62,.35);overflow:auto}
dialog.tooldlg::backdrop{background:rgba(20,28,62,.6)}
.tool-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;background:var(--indigo);color:#fff;padding:18px clamp(16px,3vw,28px)}
.tool-head .tool-ic{flex:none;width:44px;height:44px;border-radius:11px;background:var(--saffron);color:var(--indigo-deep);display:flex;align-items:center;justify-content:center}
.tool-head .tool-ic svg{width:26px;height:26px}
.tool-head h3{font-size:22px;font-weight:800;line-height:1.2}
.tool-sub{font-size:14px;color:#C9D0E6}
.tool-head .close{margin-left:auto}
.tool-body{padding:20px clamp(16px,3vw,28px) 26px}
.tool-note{margin-top:14px;font-size:13.5px;color:var(--muted)}
.tool-note.top{margin:0 0 12px}
.btn-line.sm{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;color:var(--tile);cursor:pointer;font-weight:600}
.btn-line.sm:hover{border-color:var(--tile)}

/* CBM */
.cbm-rows{display:grid;gap:10px;margin-bottom:10px}
.cbm-row{position:relative;display:grid;grid-template-columns:70px repeat(5,1fr) 32px;gap:8px;align-items:end;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.cbm-n{font-size:13px;font-weight:700;color:var(--muted);align-self:center}
.cbm-row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.cbm-row input,.unit-box input{width:100%;font:inherit;font-size:15px;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.cbm-row input:focus,.unit-box input:focus{outline:2px solid var(--tile);outline-offset:0;border-color:var(--tile)}
.cbm-del{width:32px;height:36px;border:0;background:none;color:#9AA1B5;font-size:22px;cursor:pointer;border-radius:6px}
.cbm-del:hover{color:#E5484D;background:#fff}
.cbm-out{margin-top:16px}
.cbm-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cbm-sum div{background:var(--indigo);color:#fff;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cbm-sum span{font-size:12.5px;color:#C9D0E6}
.cbm-sum b{font-size:19px;font-weight:800}
.cbm-fill-t{margin:16px 0 8px;font-size:14px;font-weight:700}
.cbm-fill{display:grid;gap:8px}
.fill{display:grid;grid-template-columns:70px 1fr 64px;align-items:center;gap:10px;font-size:14px}
.fill .bar{height:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill .bar i{display:block;height:100%;background:var(--tile);border-radius:999px;transition:width .25s}
.fill .bar i.over{background:#E5484D}
.fill b{text-align:right}
@media (max-width:640px){
  .cbm-row{grid-template-columns:repeat(3,1fr);padding:10px 40px 10px 10px}
  .cbm-n{grid-column:1/-1}
  .cbm-del{position:absolute;right:4px;top:4px}
  .cbm-sum{grid-template-columns:1fr 1fr}
}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{background:var(--paper);font-size:13px;color:var(--muted);font-weight:700}
.tbl tbody th{font-weight:700;white-space:nowrap}
.tbl tr:last-child>*{border-bottom:0}
.tbl .grp th{background:#FFF4DC;color:#8A5A00;font-size:13px}
.inco tbody th b{display:inline-block;min-width:44px;background:var(--indigo);color:#fff;border-radius:5px;padding:2px 6px;text-align:center;font-size:13px}

/* Units */
.unit{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unit-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:grid;gap:8px}
.unit-box legend{font-weight:700;font-size:14px;padding:0 4px}
.unit-box label{display:grid;grid-template-columns:1fr 72px;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.unit{grid-template-columns:1fr}}

/* Clocks */
.clocks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ck{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#fff}
.ck-city{font-size:13.5px;font-weight:700}
.ck b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;color:var(--ink)}
.ck-date{font-size:12.5px;color:var(--muted)}
.ck-st{margin-top:4px;align-self:flex-start;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--muted)}
.ck.on{border-color:var(--tile)}
.ck.on .ck-st{background:#E2F4F4;color:#11605F}
@media (max-width:760px){.clocks{grid-template-columns:repeat(2,1fr)}}

/* Floating quick menu */
.fab{position:fixed;right:18px;bottom:18px;z-index:50}
.fab-btn{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--indigo);color:#fff;padding:12px 18px 12px 14px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 10px 28px rgba(20,28,62,.35)}
.fab-btn svg{width:22px;height:22px;color:var(--saffron)}
.fab-btn:hover{background:var(--indigo-deep)}
.fab.open .fab-btn{background:var(--indigo-deep)}
.fab-panel{position:absolute;right:0;bottom:62px;width:340px;max-height:min(70vh,620px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px rgba(20,28,62,.3);color:var(--ink)}
.fab-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;background:var(--indigo);color:#fff;padding:12px 14px}
.fab-head b{font-size:15px}
.fab-x{border:0;background:rgba(255,255,255,.15);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}
.fab-body{padding:10px 12px 4px}
.fab-group{margin-bottom:10px}
.fab-group p{font-size:12px;font-weight:700;color:var(--gi);margin:2px 2px 6px;display:flex;align-items:center;gap:6px}
.fab-group p::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--g)}
.fab-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fab-grid .tool-tile{padding:7px 8px;gap:8px;border-radius:7px}
.fab-grid .tt-ic{width:28px;height:28px;border-radius:7px}
.fab-grid .tt-ic svg{width:17px;height:17px}
.fab-grid .tt-tx b{font-size:13px;font-weight:600}
.fab-grid .tt-ext{display:none}
.fab-grid .tt-dot{top:5px;right:5px;width:7px;height:7px}
.fab-all{display:block;text-align:center;margin:4px 12px 12px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:600;color:var(--tile);text-decoration:none}
.fab-all:hover{border-color:var(--tile)}
@media (max-width:640px){
  .fab{right:12px;bottom:12px}
  .fab-btn{padding:11px 14px 11px 12px;font-size:13.5px}
  .fab-panel{position:fixed;right:12px;left:12px;bottom:70px;width:auto}
}

/* Uniform tool button sizes */
.tool-tile{height:66px}
.tt-tx{flex:1}
.tt-tx b,.tt-tx small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab-grid .tool-tile{height:44px}
.fab-grid .tt-tx b{font-size:13px}

/* ===== Trade news ===== */
.news{background:#fff;border-bottom:1px solid var(--line)}
.news-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.news-updated{font-size:13.5px;color:var(--muted);padding-bottom:6px}
.news-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.nchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.nchip span{font-size:12px;color:var(--muted);font-weight:700}
.nchip:hover{border-color:var(--tile)}
.nchip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.nchip[aria-pressed="true"] span{color:var(--saffron)}
.news-days{margin-top:18px}
.news-day+.news-day{margin-top:26px}
.nday{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--indigo);font-size:17px}
.nday b{font-weight:800;color:var(--ink)}
.nday span{font-size:13px;color:var(--muted);font-weight:500}
.nday i{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--indigo);background:var(--paper);border-radius:999px;padding:1px 9px}
.news-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.news-more{display:block;margin:22px auto 0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 22px;font:inherit;font-size:14.5px;font-weight:600;color:var(--indigo);cursor:pointer}
.news-more:hover{border-color:var(--tile);color:var(--tile)}
.news-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.nrank{flex:none;width:28px;height:28px;border-radius:7px;background:var(--paper);color:var(--indigo);font-family:var(--display);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.news-item:nth-child(-n+3) .nrank{background:var(--indigo);color:var(--saffron)}
.nbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.nbody a{color:var(--ink);text-decoration:none;font-size:16px;font-weight:600;line-height:1.45}
.nbody a:hover{color:var(--tile);text-decoration:underline;text-underline-offset:3px}
.nmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.ncat{font-weight:700;padding:1px 8px;border-radius:999px;font-size:11.5px}
.ncat.c-policy{background:#FFF4DC;color:#8A5A00}
.ncat.c-world{background:#FDECEC;color:#A12A2E}
.ncat.c-cis{background:#E2F4F4;color:#11605F}
.ncat.c-logistics{background:#F1ECFF;color:#4A35A0}
.news-empty{grid-column:1/-1;padding:28px 0;color:var(--muted);text-align:center}
.news-note{margin-top:14px;font-size:12.5px;color:var(--muted)}
@media (max-width:860px){.news-list{grid-template-columns:1fr}}

/* Visitor counter */
.visits{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:#8F99BE}
.visits b{color:#fff;font-weight:700;margin-left:4px}

/* ===== Export control & certification ===== */
.comp{background:#fff}
.comp-tabs{display:inline-flex;gap:4px;margin:28px 0 22px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.comp-tabs button{border:0;background:none;font:inherit;font-size:15.5px;font-weight:700;color:var(--muted);padding:9px 18px;border-radius:7px;cursor:pointer}
.comp-tabs button[aria-selected="true"]{background:var(--indigo);color:#fff}
.comp-disc{margin-top:16px;font-size:13px;color:var(--muted)}
.comp-disc a{color:var(--tile)}

/* strategic goods */
.sg-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
.sg-main h3{font-size:22px;font-weight:800;margin-bottom:8px}
.sg-main h4,.sg-side h4{font-size:17px;font-weight:800;margin:22px 0 10px}
.sg-side h4:first-child{margin-top:0}
.sg-main>p{font-size:16px}
.sg-types{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 8px}
.sg-types li{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.sg-types b{font-size:15px}
.sg-types span{font-size:13.5px;color:var(--muted);line-height:1.45}
.sg-types em{font-style:normal;font-size:12px;font-weight:700;color:var(--tile);margin-top:auto}
.sg-law{font-size:13px;color:var(--muted)}
.sg-steps{list-style:none;display:grid;gap:8px}
.sg-steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border-left:3px solid var(--saffron);background:var(--paper);border-radius:0 8px 8px 0;padding:10px 12px}
.sg-steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--indigo);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.sg-steps b{font-size:15.5px}
.sg-steps p{font-size:14.5px;color:var(--ink);line-height:1.55}
.sg-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.sg-card{border:1px solid var(--line);border-top:4px solid var(--tile);border-radius:8px;padding:12px}
.sg-card.warn{border-top-color:var(--saffron);background:#FFFAEE}
.sg-card.red{border-top-color:#E5484D;background:#FFF5F5}
.sg-card b{font-size:15px}
.sg-card p{font-size:13.5px;line-height:1.55;margin-top:4px}
.sg-links{display:grid;gap:8px}
.sg-link{display:block;border:1px solid var(--line);border-radius:8px;padding:11px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.sg-link:hover{border-color:var(--tile);background:#F2FAFA}
.sg-link.main{background:var(--indigo);border-color:var(--indigo);color:#fff}
.sg-link.main:hover{background:var(--indigo-deep)}
.sg-link b{display:block;font-size:15.5px}
.sg-link span{display:block;font-size:13.5px;opacity:.85;line-height:1.4}
.sg-link small{display:block;font-size:12px;margin-top:3px;color:var(--saffron)}
.sg-link:not(.main) small{color:var(--tile)}
.sg-check{margin-top:22px;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--paper)}
.sg-check>p{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
.sg-qs{display:grid;gap:8px}
.sg-q{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.5}
.sg-q input{width:18px;height:18px;margin-top:2px;accent-color:var(--indigo)}
.sg-q:has(input:checked){border-color:var(--indigo);background:#EEF1FA}
.sg-res{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55}
.sg-res.ok{background:#E2F4F4;color:#11605F}
.sg-res.alert{background:#FFF4DC;border:1px solid #F0D28C}
.sg-res ul{padding-left:18px;margin:6px 0 8px;display:grid;gap:4px}
.sg-res-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sg-res-links a{font-weight:700;color:var(--indigo)}
.sg-reset{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:13px;padding:4px 10px;cursor:pointer}

/* certification matrix */
.ct-lead{font-size:15.5px;color:var(--muted);margin-bottom:12px}
.ct-bar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-bottom:12px}
.ct-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.ct-legend>span:first-child{font-weight:700;margin-right:4px}
.ct-legend small{font-size:12.5px;color:var(--muted);margin-right:8px}
.lg{display:inline-block;width:16px;height:16px;border-radius:4px}
.lv1{--lv:#E6F5EC;--lvb:#2E9E5B}
.lv2{--lv:#FFF4DC;--lvb:#D99A1E}
.lv3{--lv:#FDE8E8;--lvb:#D64545}
.lg{background:var(--lv);border:2px solid var(--lvb)}
.cc{display:inline-block;font-size:12px;font-weight:700;line-height:1.3;padding:2px 7px;border-radius:5px;white-space:nowrap}
.cc.t-m{background:var(--indigo);color:#fff}
.cc.t-c{background:#fff;color:var(--indigo);border:1px solid var(--indigo)}
.cc.t-v{background:#fff;color:var(--muted);border:1px dashed var(--muted)}
.cc.more{background:var(--paper);color:var(--muted)}
.ct-filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.ct-filter>span{font-size:13px;font-weight:700;margin-right:4px}
.mchip{border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-size:13px;padding:4px 11px;cursor:pointer;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.mchip b{font-size:11px;color:var(--tile)}
.mchip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.mchip[aria-pressed="true"] b{color:var(--saffron)}
.ct-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.ct-table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;table-layout:fixed;font-size:13px}
.ct-table col.c0{width:128px}
.ct-table th,.ct-table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:stretch}
.ct-table tr>*:last-child{border-right:0}
.ct-table tbody tr:last-child>*{border-bottom:0}
.ct-table thead th{background:var(--indigo);position:sticky;top:0}
.ct-table th.corner{position:sticky;left:0;z-index:3;background:var(--indigo);min-width:132px}
.ct-table tbody th{position:sticky;left:0;z-index:2;background:#fff;min-width:132px}
.mh,.ih,.cell{display:flex;width:100%;height:100%;border:0;font:inherit;cursor:pointer;text-align:left}
.mh{flex-direction:column;align-items:flex-start;gap:1px;background:none;color:#fff;padding:9px 10px;line-height:1.25}
.mh b{font-size:12px;color:var(--saffron)}
.mh span{font-size:12.5px;font-weight:700;line-height:1.2}
.mh:hover{background:var(--indigo-deep)}
.ih{background:none;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--ink);align-items:center;line-height:1.35}
.ih:hover{color:var(--tile)}
.cell{flex-wrap:wrap;align-content:flex-start;gap:4px;padding:8px;min-height:74px;background:var(--lv);border-left:4px solid var(--lvb);transition:filter .12s,box-shadow .12s}
.cell:hover{filter:brightness(.97);box-shadow:inset 0 0 0 2px var(--lvb)}
.cell em{flex-basis:100%;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:auto}
.cell .cc{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:2px 5px}
.cell .cc.more{flex:none}

/* detail dialog */
.certdlg .cd-code{font-family:var(--display);font-weight:800;font-size:14px}
.certdlg .tool-body h4{font-size:16px;font-weight:800;margin:18px 0 8px}
.cd-meta{display:flex;flex-wrap:wrap;gap:8px}
.lvbadge,.leadbadge{font-size:13.5px;padding:5px 10px;border-radius:6px}
.lvbadge{background:var(--lv);border:1px solid var(--lvb);font-weight:700}
.leadbadge{background:var(--paper);border:1px solid var(--line)}
.cr-list{list-style:none;display:grid;gap:8px}
.cr{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:11px 12px}
.cr .cc{text-align:center;white-space:normal}
.cr b{font-size:15px}
.cr p{font-size:14px;line-height:1.55;margin-top:2px}
.cr-link{display:inline-block;margin-top:4px;font-size:12.5px;color:var(--tile);word-break:break-all}
.cd-note{margin-top:14px;background:#FFFAEE;border-left:4px solid var(--saffron);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14.5px}
.cd-note ul{padding-left:18px;margin-top:4px;display:grid;gap:3px}
.cd-ov{font-size:15.5px}
.cd-links{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:12px;font-size:14px}
.cd-links a{color:var(--tile);font-weight:600}
.cd-actions,.cd-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cd-foot a.btn-line,.cd-actions .btn-line{text-decoration:none;border-style:solid}
.cd-ask{background:var(--indigo)!important;color:#fff!important;border-color:var(--indigo)!important}
.cd-tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.cd-tbl th,.cd-tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.cd-tbl td .cc{margin:1px 2px 1px 0}
.cd-tbl .ld{white-space:nowrap;color:var(--muted);font-size:12.5px}
.cd-row{border:0;background:none;font:inherit;font-weight:700;color:var(--indigo);cursor:pointer;text-align:left;padding:0}
.cd-row b{color:var(--tile);font-size:12px}
.cd-row:hover{text-decoration:underline}
.lvdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--lv);border:3px solid var(--lvb)}

}

.ih{overflow-wrap:anywhere;hyphens:auto}
@media (max-width:640px){.ct-legend{flex-direction:column;align-items:flex-start}.ct-legend.tl{flex-direction:row}}

function openDetail(i){

// ===== 히어로 세계지도 (Natural Earth 육지 데이터를 2도 간격 점으로 변환) =====
const WorldMap=(function(){
  const NS='http://www.w3.org/2000/svg', svg=document.getElementById('worldSvg');
  const L0=-128, B1=72, STEP=2, CELL=8.5;
  const P=(lon,lat)=>[(lon-L0)/STEP*CELL+CELL/2,(B1-lat)/STEP*CELL+CELL/2];
  const el=(tg,a,parent)=>{const e=document.createElementNS(NS,tg); for(const k in a) e.setAttribute(k,a[k]); if(parent) parent.appendChild(e); return e;};
  let html='';
  RUNS.split('|').forEach((row,r)=>{ if(!row) return; row.split(',').forEach(run=>{ const [c,n]=run.split('.').map(Number); for(let i=0;i<n;i++) html+=`<circle cx="${((c+i)*CELL+CELL/2).toFixed(1)}" cy="${(r*CELL+CELL/2).toFixed(1)}" r="2.1"/>`; }); });
  document.getElementById('wmDots').innerHTML=html;
  const HUB={id:'hub', ll:[126.98,37.57], lab:'b'};
  const CITIES=[
    {id:'bei', ll:[116.40,39.90], lab:'tl'},{id:'tok', ll:[139.69,35.69], lab:'r'},
    {id:'han', ll:[105.85,21.03], lab:'l'},{id:'ban', ll:[100.50,13.76], lab:'l'},
    {id:'tas', ll:[69.24,41.30], lab:'b'},{id:'ast', ll:[71.45,51.17], lab:'t'},
    {id:'mos', ll:[37.62,55.76], lab:'t'},{id:'riy', ll:[46.68,24.71], lab:'b'},
    {id:'ber', ll:[13.40,52.52], lab:'tl'},{id:'mad', ll:[-3.70,40.42], lab:'b'},
    {id:'was', ll:[-77.04,38.91], lab:'t', labSm:'r'}
  ];
  const arcs=document.getElementById('wmArcs'), cities=document.getElementById('wmCities');
  const [hx,hy]=P(...HUB.ll);
  el('circle',{cx:hx,cy:hy,r:34,fill:'url(#hubGlow)'},arcs);
  function addCity(c,isHub){
    const [x,y]=P(...c.ll); const g=el('g',{class:'wm-city'+(isHub?' wm-hub on':'')},cities);
    el('circle',{class:'pulse',cx:x,cy:y,r:isHub?6:4},g);
    el('circle',{class:'pt',cx:x,cy:y,r:isHub?5.5:3.6},g);
    g._t=el('text',{},g); g._s=el('text',{class:'sub'},g);
    g._pos=[x,y]; g._lab=c.lab; g._labSm=c.labSm; g._id=c.id;
    return g;
  }
  let small=false;
  function setNames(){ cities.querySelectorAll('.wm-city').forEach(g=>{ const nm=t('city')[g._id]; g._t.textContent=nm[0]; g._s.textContent=nm[1]; }); }
  function placeLabels(fs){
    cities.querySelectorAll('.wm-city').forEach(g=>{
      const [x,y]=g._pos, d=fs*0.85, lh=fs*1.05; let tx=x, ty=y, anc='middle';
      switch((small&&g._labSm)||g._lab){
        case 't': ty=y-d-lh; break;
        case 'b': ty=y+d+fs*0.6; break;
        case 'l': tx=x-d; ty=y-fs*0.1; anc='end'; break;
        case 'r': tx=x+d; ty=y-fs*0.1; anc='start'; break;
        case 'tl': tx=x-d*0.6; ty=y-d-lh*0.7; anc='end'; break;
      }
      [[g._t,ty],[g._s,ty+lh*0.95]].forEach(([e,yy])=>{e.setAttribute('x',tx.toFixed(1)); e.setAttribute('y',yy.toFixed(1)); e.setAttribute('text-anchor',anc);});
    });
  }
  addCity(HUB,true);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items=CITIES.map(c=>{
    const [x,y]=P(...c.ll), dist=Math.hypot(x-hx,y-hy), bend=Math.min(0.32,0.18+dist/4000);
    const cx=(hx+x)/2, cy=(hy+y)/2-dist*bend-6;
    const path=el('path',{class:'wm-arc',d:`M${hx.toFixed(1)},${hy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`},arcs);
    return {path,g:addCity(c,false),len:path.getTotalLength()};
  });
  function fit(){
    const w=svg.getBoundingClientRect().width||1200; small=w<700;
    const vb=small?[170,30,1090,320]:[0,0,1200,372];
    svg.setAttribute('viewBox',vb.join(' '));
    const sc=w/vb[2], fs=(small?10.5:13)/sc, fs2=10.5/sc;
    svg.style.setProperty('--wm-fs',fs.toFixed(1)+'px'); svg.style.setProperty('--wm-fs2',fs2.toFixed(1)+'px');
    svg.querySelectorAll('.wm-city text.sub').forEach(e=>e.style.display=small?'none':'');
    placeLabels(fs);
  }
  setNames(); fit(); addEventListener('resize',fit);
  function finish(it){
    it.g.classList.add('on');
    it.path.style.strokeDasharray=''; it.path.style.strokeDashoffset=''; it.path.classList.add('drawn');
    if(reduce) return;
    const dot=el('circle',{class:'wm-run',r:2.6},arcs);
    const mo=el('animateMotion',{dur:(2.4+it.len/420).toFixed(2)+'s',repeatCount:'indefinite',begin:'indefinite',path:it.path.getAttribute('d')},dot);
    try{mo.beginElement()}catch(e){}
  }
  if(reduce){ items.forEach(finish); }
  else items.forEach((it,i)=>{
    it.path.style.strokeDasharray=it.len; it.path.style.strokeDashoffset=it.len;
    it.path.animate([{strokeDashoffset:it.len},{strokeDashoffset:0}],{duration:900+it.len*0.9,delay:300+i*260,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'}).finished.then(()=>finish(it));
  });
  return {relabel(){ setNames(); fit(); }};
})();

  else{
    const [x1,y1,x2,y2]=p.box, w=x2-x1, h=y2-y1, k=Math.min(W/w,H/h);
    inner=`<span class="sp" role="img" aria-label="${esc(p.name)}" style="width:${(w*k).toFixed(1)}px;height:${(h*k).toFixed(1)}px;background-image:var(--sprite);background-size:${(1920*k).toFixed(1)}px ${(1080*k).toFixed(1)}px;background-position:-${(x1*k).toFixed(1)}px -${(y1*k).toFixed(1)}px"></span>`;
  }
  return p.url ? `<a class="plogo" href="${p.url}" target="_blank" rel="noopener${p.sponsored?' sponsored':''}" data-hp="${esc(t('pa.hp'))}" title="${esc(t('pa.open',p.name))}">${inner}</a>` : `<span class="plogo" title="${esc(p.name)}">${inner}</span>`;
}
const Partners=(function(){
  const probe=new Image();
  probe.onload=()=>document.documentElement.style.setProperty('--sprite',`url(${SPRITE_LOCAL})`);
  probe.onerror=()=>document.documentElement.style.setProperty('--sprite',`url(${SPRITE_CDN})`);
  probe.src=SPRITE_LOCAL;
  const track=document.getElementById('pcTrack'), view=track.parentElement, root=document.getElementById('partnerCarousel');
  const all=document.getElementById('partnerAll'), allBtn=root.querySelector('.pc-all');
  let per=4, pos=0, timer=null, paused=false;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const perFor=()=>innerWidth<560?3:innerWidth<1000?4:5;
  function build(){
    per=perFor(); root.style.setProperty('--per',per);
    const sm=innerWidth<560, list=PARTNERS.concat(PARTNERS.slice(0,per));
    track.innerHTML=list.map((p,i)=>`<li${i>=PARTNERS.length?' aria-hidden="true"':''}>${logoHTML(p,sm?92:150,sm?56:76)}</li>`).join('');
    track.querySelectorAll('li[aria-hidden] a').forEach(a=>a.tabIndex=-1);
    jump(pos=Math.min(pos,PARTNERS.length-1)-(Math.min(pos,PARTNERS.length-1)%per));
  }
  function buildAll(){ const sm=innerWidth<560; all.innerHTML=PARTNERS.map(p=>`<li>${logoHTML(p,sm?110:150,sm?60:76)}</li>`).join(''); }
  function jump(i){ track.style.transition='none'; track.style.transform=`translateX(-${i*100/per}%)`; track.offsetHeight; track.style.transition=''; }
  function go(dir){ const n=PARTNERS.length; if(dir<0&&pos===0){pos=n;jump(pos);} pos+=dir*per; if(pos<0) pos=0; track.style.transform=`translateX(-${pos*100/per}%)`; }
  track.addEventListener('transitionend',()=>{ if(pos>=PARTNERS.length){ pos-=PARTNERS.length; jump(pos); } });
  function start(){ clearInterval(timer); if(!reduce) timer=setInterval(()=>{ if(!paused&&!document.hidden) go(1); },2000); }
  root.addEventListener('mouseenter',()=>paused=true); root.addEventListener('mouseleave',()=>paused=false);
  root.addEventListener('focusin',()=>paused=true); root.addEventListener('focusout',()=>paused=false);
  root.querySelectorAll('.pc-btn').forEach(b=>b.addEventListener('click',()=>{ go(+b.dataset.dir); start(); }));
  let sx=null; view.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;paused=true},{passive:true});
  view.addEventListener('touchend',e=>{ if(sx!==null){const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(dx<0?1:-1);} sx=null; paused=false; start(); });
  const setAllLabel=()=>{ allBtn.textContent=all.hidden?t('pa.all'):t('pa.fold'); allBtn.setAttribute('aria-expanded',!all.hidden); };
  allBtn.addEventListener('click',()=>{ if(all.hidden&&!all.childElementCount) buildAll(); all.hidden=!all.hidden; setAllLabel(); });
  let rw=innerWidth; addEventListener('resize',()=>{ if(perFor()!==per||(innerWidth<560)!==(rw<560)){ rw=innerWidth; pos=0; build(); if(!all.hidden) buildAll(); else all.innerHTML=''; } });
  pos=0; build(); setAllLabel(); start();
  return {relabel(){ build(); if(!all.hidden) buildAll(); else all.innerHTML=''; setAllLabel(); }};
})();

function toolBody(id){
  if(id==='cbm'){
    return `<div class="cbm">
      <div class="cbm-rows" id="cbmRows"></div>
      <button type="button" class="btn-line sm" id="cbmAdd">${tt('cbm.add')}</button>
      <div class="cbm-out" id="cbmOut"></div>
      <p class="tool-note">${tt('cbm.note')}</p></div>`;
  }
  if(id==='container'){
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tt('ct.type')}</th><th>${tt('ct.inner')}</th><th>${tt('ct.door')}</th><th>${tt('ct.cap')}</th><th>${tt('ct.pay')}</th></tr></thead><tbody>${CONT.map(c=>`<tr><th>${c.t}</th><td>${c.inner}</td><td>${c.door}</td><td>${fmt(c.cap,1)} m³</td><td>${c.pay}</td></tr>`).join('')}</tbody></table></div><p class="tool-note">${tt('ct.note')}</p>`;
  }
  if(id==='unit'){
    return `<div class="unit">${['len','wt','vol'].map(k=>`<fieldset class="unit-box"><legend>${tt('u.'+k)}</legend>${UNITS[k].map(([u],i)=>`<label><input type="number" inputmode="decimal" step="any" data-cat="${k}" data-i="${i}" aria-label="${u}"><span>${u}</span></label>`).join('')}</fieldset>`).join('')}</div>`;
  }
  if(id==='clock'){
    return `<div class="clocks" id="clocks"></div><p class="tool-note">${tt('ck.note')}</p>`;
  }
  if(id==='incoterms'){
    const row=r=>`<tr><th><b>${r[0]}</b></th><td>${esc(L(r[2]))}</td><td>${esc(L(r[3]))}</td></tr>`;
    const grp=(g,label)=>`<tr class="grp"><th colspan="3">${label}</th></tr>`+INCO.filter(r=>r[1]===g).map(row).join('');
    return `<p class="tool-note top">${tt('ic.note')}</p><div class="tbl-wrap"><table class="tbl inco"><thead><tr><th>${tt('ic.term')}</th><th>${tt('ic.risk')}</th><th>${tt('ic.cost')}</th></tr></thead><tbody>${grp('any',tt('ic.any'))}${grp('sea',tt('ic.sea'))}</tbody></table></div>`;
  }
  return '';
}
function initTool(id,root){
  if(id==='cbm'){
    const rowsEl=root.querySelector('#cbmRows'), out=root.querySelector('#cbmOut');
    const draw=()=>{
      rowsEl.innerHTML=cbmRows.map((r,i)=>`<div class="cbm-row" data-i="${i}"><span class="cbm-n">${tt('cbm.item')} ${i+1}</span>
        ${['l','w','h','q','kg'].map(k=>`<label><span>${tt('cbm.'+k)}</span><input type="number" min="0" step="any" inputmode="decimal" data-k="${k}" value="${esc(r[k])}"></label>`).join('')}
        ${cbmRows.length>1?`<button type="button" class="cbm-del" aria-label="${tt('cbm.del')}">×</button>`:''}</div>`).join('');
      calc();
    };
    const calc=()=>{
      let v=0,w=0; cbmRows.forEach(r=>{const q=+r.q||0; v+=(+r.l||0)*(+r.w||0)*(+r.h||0)/1e6*q; w+=(+r.kg||0)*q;});
      const rt=Math.max(v,w/1000), air=v*167;
      out.innerHTML=`<div class="cbm-sum"><div><span>${tt('cbm.vol')}</span><b>${fmt(v,3)} CBM</b></div><div><span>${tt('cbm.wt')}</span><b>${fmt(w,1)} kg</b></div><div><span>${tt('cbm.rt')}</span><b>${fmt(rt,3)} R/T</b></div><div><span>${tt('cbm.air')}</span><b>${fmt(air,1)} kg</b></div></div>
        <p class="cbm-fill-t">${tt('cbm.fill')}</p><div class="cbm-fill">${CONT.map(c=>{const p=v/c.cap*100; return `<div class="fill"><span>${c.t}</span><div class="bar"><i style="width:${Math.min(p,100).toFixed(1)}%" class="${p>100?'over':''}"></i></div><b>${fmt(p,1)}%</b></div>`;}).join('')}</div>`;
    };
    rowsEl.addEventListener('input',e=>{const inp=e.target.closest('input'); if(!inp) return; const i=+inp.closest('.cbm-row').dataset.i; cbmRows[i][inp.dataset.k]=inp.value; calc();});
    rowsEl.addEventListener('click',e=>{const b=e.target.closest('.cbm-del'); if(!b) return; cbmRows.splice(+b.closest('.cbm-row').dataset.i,1); draw();});
    root.querySelector('#cbmAdd').addEventListener('click',()=>{cbmRows.push({l:'',w:'',h:'',q:'1',kg:''}); draw(); const ins=rowsEl.querySelectorAll('.cbm-row:last-child input'); if(ins[0]) ins[0].focus();});
    draw();
  }
  if(id==='unit'){
    root.addEventListener('input',e=>{
      const inp=e.target; if(!inp.dataset.cat) return; const cat=inp.dataset.cat, list=UNITS[cat];
      const base=parseFloat(inp.value)*list[+inp.dataset.i][1];
      root.querySelectorAll(`input[data-cat="${cat}"]`).forEach(o=>{ if(o===inp) return; o.value=Number.isFinite(base)?+(base/list[+o.dataset.i][1]).toPrecision(8):''; });
    });
  }
  if(id==='clock'){
    const el=root.querySelector('#clocks');
    const tick=()=>{
      const now=new Date();
      el.innerHTML=ZONES.map(([tz,n])=>{
        let parts; try{ parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(now).map(p=>[p.type,p.value])); }catch(e){ return ''; }
        const h=+parts.hour, wk=['Sat','Sun'].includes(parts.weekday), open=!wk&&h>=9&&h<18;
        const date=new Intl.DateTimeFormat(LANG==='ru'?'ru-RU':LANG==='en'?'en-US':'ko-KR',{timeZone:tz,month:'short',day:'numeric',weekday:'short'}).format(now);
        return `<div class="ck ${open?'on':''}"><span class="ck-city">${esc(L(n))}</span><b>${parts.hour}:${parts.minute}</b><span class="ck-date">${date}</span><span class="ck-st">${wk?tt('ck.weekend'):open?tt('ck.open'):tt('ck.closed')}</span></div>`;
      }).join('');
    };
    tick(); clearInterval(clockTimer); clockTimer=setInterval(tick,20000);
  }
}

const toolDlg=document.getElementById('toolDlg');
function openTool(id){
  const tl=TOOLS.find(x=>x.id===id); if(!tl) return;
  toolDlg.dataset.tool=id;
  toolDlg.querySelector('.tool-ic').innerHTML=ticon(tl.icon);
  toolDlg.querySelector('h3').textContent=L(tl.name);
  toolDlg.querySelector('.tool-sub').textContent=L(tl.desc);
  const body=toolDlg.querySelector('.tool-body'); body.innerHTML=toolBody(id); initTool(id,body);
  if(!toolDlg.open) toolDlg.showModal();
}
function closeTool(){ clearInterval(clockTimer); toolDlg.close(); }
toolDlg.querySelector('.close').addEventListener('click',closeTool);
toolDlg.addEventListener('click',e=>{ if(e.target===toolDlg) closeTool(); });
toolDlg.addEventListener('close',()=>clearInterval(clockTimer));

function toolTile(tl,compact){
  const inner=`<span class="tt-ic">${ticon(tl.icon)}</span><span class="tt-tx"><b>${esc(compact&&tl.short?L(tl.short):L(tl.name))}</b>${compact?'':`<small>${esc(L(tl.desc))}</small>`}</span>${tl.type==='link'?`<span class="tt-ext" title="${tt('tl.ext')}">${ticon('ext')}</span>`:''}${tl.hot?'<i class="tt-dot" aria-hidden="true"></i>':''}`;
  if(tl.type==='anchor') return `<a class="tool-tile" href="${tl.url}" data-tool="${tl.id}" data-anchor>${inner.replace(/<span class="tt-ext"[\s\S]*?<\/span>/,'')}</a>`;
  return tl.type==='link'
    ? `<a class="tool-tile" href="${tl.url}" target="_blank" rel="noopener${tl.sponsored?' sponsored':''}" data-tool="${tl.id}">${inner}</a>`
    : `<button type="button" class="tool-tile" data-tool="${tl.id}" aria-haspopup="dialog">${inner}</button>`;
}
function renderTools(){
  document.getElementById('toolGroups').innerHTML=TOOL_GROUPS.map(g=>`<div class="tool-group g-${g.id}"><div class="tg-head"><h3>${esc(L(g.name))}</h3><span>${esc(L(g.note))}</span></div><div class="tool-grid">${TOOLS.filter(x=>x.g===g.id).map(x=>toolTile(x,false)).join('')}</div></div>`).join('');
  document.getElementById('fabGroups').innerHTML=TOOL_GROUPS.map(g=>`<div class="fab-group g-${g.id}"><p>${esc(L(g.name))}</p><div class="fab-grid">${TOOLS.filter(x=>x.g===g.id).map(x=>toolTile(x,true)).join('')}</div></div>`).join('');
  document.querySelectorAll('[data-tt]').forEach(e=>e.textContent=tt(e.dataset.tt));
  document.querySelectorAll('[data-tt-aria]').forEach(e=>e.setAttribute('aria-label',tt(e.dataset.ttAria)));
  if(toolDlg.open) openTool(toolDlg.dataset.tool);
}
document.addEventListener('click',e=>{ const b=e.target.closest('button.tool-tile'); if(b){ closeFab(); openTool(b.dataset.tool); } if(e.target.closest('a[data-anchor]')) closeFab(); });

let NEWS=null, newsCat='all', newsDays=3;
function ago(iso){
  const m=Math.max(1,Math.round((Date.now()-new Date(iso))/60000));
  if(m<60) return nt('n.min',m); const h=Math.round(m/60); if(h<48) return nt('n.hour',h); return nt('n.day',Math.round(h/24));
}
function renderNews(){
  document.querySelectorAll('[data-nt]').forEach(e=>e.textContent=nt(e.dataset.nt));
  const chips=document.getElementById('newsChips'), list=document.getElementById('newsList'), up=document.getElementById('newsUpdated');
  const items=(NEWS&&NEWS.items&&NEWS.items[LANG])||[];
  const count=c=>c==='all'?items.length:items.filter(i=>i.cat===c).length;
  chips.innerHTML=NEWS_CATS.map(c=>`<button type="button" class="nchip c-${c}" data-cat="${c}" aria-pressed="${c===newsCat}">${nt('n.'+c)}<span>${count(c)}</span></button>`).join('');
  if(NEWS&&NEWS.updated){
    const d=new Date(NEWS.updated);
    up.textContent=`${nt('n.updated')} ${new Intl.DateTimeFormat(LANG==='ru'?'ru-RU':LANG==='en'?'en-US':'ko-KR',{timeZone:'Asia/Seoul',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)} (KST)`;
  } else up.textContent='';
  const shown=newsCat==='all'?items:items.filter(i=>i.cat===newsCat);
  const more=document.getElementById('newsMore');
  if(!items.length){ list.innerHTML=`<div class="news-empty">${nt('n.empty')}</div>`; more.hidden=true; return; }
  if(!shown.length){ list.innerHTML=`<div class="news-empty">${nt('n.none')}</div>`; more.hidden=true; return; }
  const dayOf=i=>i.day||new Date(new Date(i.date).getTime()+9*3600e3).toISOString().slice(0,10);
  const days=[...new Set(shown.map(dayOf))].sort().reverse();
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10), yest=new Date(Date.now()-15*3600e3).toISOString().slice(0,10);
  const loc=LANG==='ru'?'ru-RU':LANG==='en'?'en-US':'ko-KR';
  const label=d=>d===today?nt('n.today'):d===yest?nt('n.yesterday'):new Intl.DateTimeFormat(loc,{month:'long',day:'numeric',weekday:'short',timeZone:'UTC'}).format(new Date(d+'T00:00:00Z'));
  const visible=days.slice(0,newsDays);
  list.innerHTML=visible.map(d=>{const its=shown.filter(i=>dayOf(i)===d).sort((x,y)=>(y.score||0)-(x.score||0)); return `<section class="news-day"><h3 class="nday"><b>${label(d)}</b><span>${d}</span><i>${its.length}</i></h3><ol class="news-list">${its.map((it,k)=>`<li class="news-item"><span class="nrank">${k+1}</span><div class="nbody"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a><span class="nmeta"><span class="ncat c-${it.cat}">${nt('n.'+it.cat)}</span>${it.source?`<span>${esc(it.source)}</span>`:''}<span>${ago(it.date)}</span></span></div></li>`).join('')}</ol></section>`;}).join('');
  more.hidden=days.length<=3;
  more.textContent=newsDays<days.length?`${nt('n.more')} (${days.length-newsDays})`:nt('n.less');
  more.dataset.all=days.length;
}
document.getElementById('newsChips').addEventListener('click',e=>{const b=e.target.closest('.nchip'); if(!b) return; newsCat=b.dataset.cat; renderNews();});
document.getElementById('newsMore').addEventListener('click',()=>{ const all=+document.getElementById('newsMore').dataset.all||0; newsDays=newsDays<all?Math.min(all,newsDays+4):3; renderNews(); if(newsDays===3) document.getElementById('news').scrollIntoView({behavior:'smooth'}); });
(async function(){
  try{ const r=await fetch('data/news.json?'+Date.now(),{cache:'no-store'}); if(r.ok) NEWS=await r.json(); }catch(e){}
  renderNews();
})();

 en:{
  'nav':'Compliance','h2':'Export Control & Certification','sub':'수출 규제·인증 가이드',

  'tab.sg':'Strategic goods','tab.cert':'Certification matrix',
  'sg.h3':'What are strategic goods?',
  'sg.def':'Goods, software and technology that could be used to develop, make or use weapons of mass destruction or conventional arms. Not only military items: machine tools, sensors, chip equipment, chemicals, drone parts and encryption software can qualify depending on their specifications (dual-use).',

  'sg.steps.h':'4 steps to check',
  'sg.steps':[['Collect data','Prepare the HS code and technical specifications (performance figures, materials, end use).'],['Classification','Self-classify on Yes-Trade or request an expert classification from KOSTI — 15-day legal limit, recently 7–8 days on average.'],['Licence','If classified as strategic, obtain an export licence before shipping (15-day limit). Even if not, check catch-all conditions.'],['Keep records','Keep classification, licence and end-user documents for later audits.']],

  'sg.catch':'Even non-listed goods need a licence if the importer or end user intends — or is suspected — to use them for WMD or related purposes.',
  'sg.ru.h':'Russia & Belarus',
  'sg.ru':'1,402 items (as of 9 Sep 2024) such as machine tools, sensors and optical parts are under catch-all licensing and are generally denied. Diversion via Central Asia, Türkiye etc. is a priority enforcement target — always verify the final destination.',
  'sg.pen.h':'Penalties',
  'sg.pen':'Exporting strategic goods without a licence can lead to up to 7 years in prison or a fine of up to 5 times the goods\' value, plus trade bans of up to 3 years.',

  'sg.l.kosti':['KOSTI (Korea Security Agency of Trade and Industry)','Expert classification · training · advice','https://www.kosti.or.kr'],
  'sg.l.yes':['Yes-Trade','HS code lookup · self-classification · licence applications','https://www.yestrade.go.kr'],
  'sg.l.motir':['Ministry of Trade and Industry','Strategic Items Notice · press releases','https://www.motir.go.kr'],
  'sg.l.bis':['US BIS (EAR)','Re-export rules for US-origin parts and technology','https://www.bis.gov'],
  'sg.q.h':'1-minute self-check','sg.q.lead':'Tick what applies and we\'ll show the recommended actions.',
  'sg.q':[
   ['Is the product used in military, nuclear, aerospace or chemical fields, or does it have high specs (precision machining, lasers, high-end sensors/cameras, encryption, high-speed computing)?','Request an expert classification — the specs may exceed control thresholds.'],
   ['Is the final destination Russia, Belarus, Iran, North Korea or another sanctioned country, or could it be re-exported via Central Asia, Türkiye, the UAE etc.?','Check the catch-all item list and obtain end-user / end-use statements.'],
   ['Is the buyer reluctant to disclose end use/user, or are the terms unusual (above-market price, cash in advance, use that doesn\'t fit the specs)?','This may trigger catch-all licensing — consult KOSTI before the deal.'],
   ['Will you send technical data, software or drawings abroad by e-mail or cloud?','Technology transfer counts as export — check whether it needs classification.'],
