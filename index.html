  'tool.ct':'Матрица сертификации','tool.cts':'Сертификаты','tool.ctd':'9 рынков × 11 отраслей'
 }
};
const ct=k=>(CC[LANG]&&CC[LANG][k]!==undefined)?CC[LANG][k]:CC.ko[k];
const KNOWTBT='http://www.knowtbt.kr';
let compTab='sg', compShown=null, sgChecked=new Set();
const CVIS_KEY='gawoo-cert-mkts';
try{ const s=JSON.parse(localStorage.getItem(CVIS_KEY)||'null'); if(Array.isArray(s)) compShown=new Set(s.filter(x=>CMKT.some(m=>m.id===x))); }catch(e){}
if(!compShown||!compShown.size) compShown=new Set(CMKT.map(m=>m.id));

function leadTxt(s){ const m=s.match(/^(\d+)-(\d+)([wm])$/); if(!m) return s; const u=m[3]==='w'?ct('ct.w'):ct('ct.mo'); return LANG==='ko'?`${m[1]}~${m[2]}${u}`:`${m[1]}–${m[2]} ${u}`; }
const lvTxt=l=>ct('ct.lv'+l);
const extA=(href,txt,cls)=>`<a href="${href}" target="_blank" rel="noopener"${cls?` class="${cls}"`:''}>${esc(txt)}</a>`;

function renderComp(){
  const root=document.getElementById('compliance'); if(!root) return;
  document.querySelectorAll('[data-ct]').forEach(e=>e.textContent=ct(e.dataset.ct));
  root.querySelectorAll('.comp-tabs button').forEach(b=>{ b.setAttribute('aria-selected',b.dataset.tab===compTab); });
  document.getElementById('compSg').hidden=compTab!=='sg';
  document.getElementById('compCert').hidden=compTab!=='cert';
  renderSg(); renderMatrix();
}

function renderSg(){
  const el=document.getElementById('compSg');
  const types=ct('sg.types').map(([a,b,c])=>`<li><b>${esc(a)}</b><span>${esc(c)}</span><em>${esc(b)}</em></li>`).join('');
  const steps=ct('sg.steps').map(([a,b],i)=>`<li><i>${i+1}</i><div><b>${esc(a)}</b><p>${esc(b)}</p></div></li>`).join('');
  const links=['sg.l.yes','sg.l.kosti','sg.l.motir','sg.l.bis'].map((k,i)=>{const [a,b,u]=ct(k); return `<a class="sg-link${i<2?' main':''}" href="${u}" target="_blank" rel="noopener"><b>${esc(a)}</b><span>${esc(b)}</span><small>${esc(u.replace(/^https?:\/\//,''))} ↗</small></a>`;}).join('');
  const qs=ct('sg.q').map(([q],i)=>`<label class="sg-q"><input type="checkbox" data-q="${i}"${sgChecked.has(i)?' checked':''}><span>${esc(q)}</span></label>`).join('');
  el.innerHTML=`
   <div class="sg-grid">
    <div class="sg-main">
     <h3>${esc(ct('sg.h3'))}</h3>
     <p>${esc(ct('sg.def'))}</p>
     <ul class="sg-types">${types}</ul>
     <p class="sg-law">${esc(ct('sg.law'))}</p>
     <h4>${esc(ct('sg.steps.h'))}</h4>
     <ol class="sg-steps">${steps}</ol>
     <div class="sg-cards">
      <div class="sg-card"><b>${esc(ct('sg.catch.h'))}</b><p>${esc(ct('sg.catch'))}</p></div>
      <div class="sg-card warn"><b>${esc(ct('sg.ru.h'))}</b><p>${esc(ct('sg.ru'))}</p></div>
      <div class="sg-card red"><b>${esc(ct('sg.pen.h'))}</b><p>${esc(ct('sg.pen'))}</p></div>
     </div>
    </div>
    <aside class="sg-side">
     <h4>${esc(ct('sg.links.h'))}</h4>
     <div class="sg-links">${links}</div>
     <div class="sg-check">
      <h4>${esc(ct('sg.q.h'))}</h4>
      <p>${esc(ct('sg.q.lead'))}</p>
      <div class="sg-qs">${qs}</div>
      <div class="sg-res" id="sgRes" aria-live="polite"></div>
     </div>
    </aside>
   </div>
   <p class="comp-disc">${esc(ct('sg.disc'))}</p>`;
  el.querySelectorAll('.sg-q input').forEach(c=>c.addEventListener('change',()=>{ const i=+c.dataset.q; c.checked?sgChecked.add(i):sgChecked.delete(i); renderSgRes(); }));
  renderSgRes();
}
function renderSgRes(){
  const r=document.getElementById('sgRes'); if(!r) return;
  const q=ct('sg.q');
  if(!sgChecked.size){ r.className='sg-res ok'; r.innerHTML=`<p>${esc(ct('sg.q.none'))}</p>`; return; }
  r.className='sg-res alert';
  r.innerHTML=`<b>${esc(ct('sg.q.res'))}</b><ul>${[...sgChecked].sort().map(i=>`<li>${esc(q[i][1])}</li>`).join('')}</ul><div class="sg-res-links">${extA('https://www.yestrade.go.kr','Yes-Trade ↗')}${extA('https://www.kosti.or.kr',ct('sg.l.kosti')[0]+' ↗')}<button type="button" class="sg-reset">${esc(ct('sg.q.reset'))}</button></div>`;
  r.querySelector('.sg-reset').addEventListener('click',()=>{ sgChecked.clear(); renderSg(); });
}

const CSHORT={NRTL:'UL/NRTL',FDA_DEV:'510(k)/PMA',FDA_EST:'FDA Reg.',FFR:'FDA Food',FSVP:'FSVP',SEA_HACCP:'HACCP',SIMP:'SIMP/MMPA',DS:'Supplement',HAZCOM:'GHS SDS',FMVSS:'FMVSS',EPA_CARB:'EPA/CARB',ROHS:'RoHS/WEEE',ECO:'Ecodesign',MACH:'CE · Mach.',EUFOOD:'Food Law',EU_HC:'Health Cert.',CATCH:'IUU Catch',FSUPP:'Food Suppl.',TOY_EU:'CE · Toys',EMARK:'E-mark',CN_ROHS:'China RoHS',CEL:'Energy Label',TS:'TS Licence',NMPA_DEV:'NMPA',NMPA_COS:'NMPA',GACC_REG:'GACC Reg.',GB_FOOD:'GB Std.',CN_HC:'Official Cert.',CN_HF:'Blue Hat',MEE12:'MEE 12',CN_HAZ:'Haz. Chem.',GITEKI:'技適',PMD_DEV:'PMD Act',PMD_COS:'PMD Act',JP_FOOD:'Food San.',JP_LABEL:'Labeling',JP_IQ:'Import Quota',FFC:'機能性表示',JP_GHS:'GHS SDS',JP_PSC:'PSC',JP_TOYFOOD:'Food San.',JP_TRVA:'UN-R',EAC_CERT:'EAC Cert.',EAC_DEC:'EAC Decl.',SGR:'СГР',EAEU_MED:'EAEU Reg.',FSB:'FSB',VET:'Vet Cert.',CHZ:'Честный ЗНАК',TR041:'TR 041',UZ_CERT:'UZ Cert.',UZ_REG:'High-risk Reg.',UZ_MED:'MoH Reg.',UZ_RADIO:'Radio Cert.',UZ_VET:'Vet/Phyto',UZ_LABEL:'Asl Belgisi',VN_CR:'CR Mark',VN_MEPS:'Energy Label',VN_TA:'Type Approval',VN_MED:'MOH',VN_COS:'DAV',VN_FOOD:'Decree 15',VN_IMPORT:'Import Insp.',VN_CHEM:'Chem. Law',VN_VR:'VR',TISI:'TISI',TH_MED:'Thai FDA',TH_COS:'Thai FDA',TH_FOOD:'Thai FDA',TH_FISH:'DOF Permit',TH_HAZ:'Haz. Subst.',SABER:'SABER',GMARK:'G-Mark',SA_EE:'Energy Eff.',CST:'CST',SFDA_MD:'SFDA',SFDA_COS:'SFDA',SFDA_FOOD:'SFDA',SA_HF:'SFDA'};
const cshort=id=>CSHORT[id]||CERT[id].n;
function cellCerts(cell,max){
  const list=cell[1]; const shown=list.slice(0,max).map(([id,t])=>`<span class="cc t-${t}" title="${esc(CERT[id].n)}">${esc(cshort(id))}</span>`).join('');
  return shown+(list.length>max?`<span class="cc more">+${list.length-max}</span>`:'');
}
function renderMatrix(){
  const el=document.getElementById('compCert');
  const mk=CMKT.filter(m=>compShown.has(m.id));
  const chips=`<button type="button" class="mchip all" data-m="*" aria-pressed="${compShown.size===CMKT.length}">${esc(ct('ct.all'))}</button>`+CMKT.map(m=>`<button type="button" class="mchip" data-m="${m.id}" aria-pressed="${compShown.has(m.id)}"><b>${m.code}</b>${esc(L(m.name))}</button>`).join('');
  const head=mk.map(m=>`<th scope="col"><button type="button" class="mh" data-country="${m.id}"><b>${m.code}</b><span>${esc(L(m.short))}</span></button></th>`).join('');
  const rows=CIND.map(ind=>`<tr><th scope="row"><button type="button" class="ih" data-ind="${ind.id}">${esc(L(ind.name))}</button></th>${mk.map(m=>{const c=CMAT[ind.id][m.id]; return `<td><button type="button" class="cell lv${c[0]}" data-ind="${ind.id}" data-country="${m.id}" aria-label="${esc(L(ind.name))} · ${esc(L(m.name))} · ${esc(lvTxt(c[0]))}">${cellCerts(c,2)}<em>${esc(leadTxt(c[2]))}</em></button></td>`;}).join('')}</tr>`).join('');
  el.innerHTML=`
   <p class="ct-lead">${esc(ct('ct.lead'))}</p>
   <div class="ct-bar">
    <div class="ct-legend"><span>${esc(ct('ct.lv'))}</span>${[1,2,3].map(l=>`<span class="lgi"><i class="lg lv${l}"></i><small>${esc(lvTxt(l))}</small></span>`).join('')}</div>
    <div class="ct-legend tl"><span class="cc t-m">${esc(ct('ct.m'))}</span><span class="cc t-c">${esc(ct('ct.c'))}</span><span class="cc t-v">${esc(ct('ct.v'))}</span></div>
   </div>
   <div class="ct-filter" role="group" aria-label="${esc(ct('ct.filter'))}"><span>${esc(ct('ct.filter'))}</span>${chips}</div>
   <div class="ct-wrap"><table class="ct-table"><colgroup><col class="c0">${mk.map(()=>'<col>').join('')}</colgroup><thead><tr><th scope="col" class="corner"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
   <p class="comp-disc">${esc(ct('ct.disc'))} ${extA(KNOWTBT,'KnowTBT ↗')}</p>`;
  el.querySelectorAll('.mchip').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.m;
    if(id==='*') compShown=new Set(CMKT.map(m=>m.id));
    else if(compShown.size===CMKT.length) compShown=new Set([id]);
    else { compShown.has(id)?compShown.delete(id):compShown.add(id); if(!compShown.size) compShown=new Set(CMKT.map(m=>m.id)); }
    try{ localStorage.setItem(CVIS_KEY,JSON.stringify([...compShown])); }catch(e){}
    renderMatrix();
  }));
  el.querySelectorAll('.cell').forEach(b=>b.addEventListener('click',()=>openCert('cell',b.dataset.ind,b.dataset.country)));
  el.querySelectorAll('.mh').forEach(b=>b.addEventListener('click',()=>openCert('country',null,b.dataset.country)));
  el.querySelectorAll('.ih').forEach(b=>b.addEventListener('click',()=>openCert('ind',b.dataset.ind,null)));
}

// ---- 상세 대화상자 ----
const certDlg=document.getElementById('certDlg');
let certState=null, certHist=[];
function certRow(id,t){ const c=CERT[id]; return `<li class="cr t-${t}"><span class="cc t-${t}">${esc(ct('ct.'+t))}</span><div><b>${esc(c.n)}</b><p>${esc(L(c.d))}</p>${c.url?extA(c.url,c.url.replace(/^https?:\/\//,'').replace(/\/$/,'').replace('xn--80ajghhoc2aj1c8b.xn--p1ai','честныйзнак.рф')+' ↗','cr-link'):''}</div></li>`; }
function openCert(kind,ind,country,push){
  if(push!==false&&certState&&certDlg.open) certHist.push(certState);
  if(push===false) {} else if(!certDlg.open) certHist=[];
  certState=[kind,ind,country];
  const h=certDlg.querySelector('h3'), sub=certDlg.querySelector('.tool-sub'), body=certDlg.querySelector('.tool-body'), ic=certDlg.querySelector('.tool-ic');
  const m=country&&CMKT.find(x=>x.id===country), I=ind&&CIND.find(x=>x.id===ind);
  let html='';
  if(kind==='cell'){
    const c=CMAT[ind][country];
    ic.textContent=m.code; h.textContent=`${L(m.name)} · ${L(I.name)}`; sub.textContent=lvTxt(c[0]);
    html=`<div class="cd-meta"><span class="lvbadge lv${c[0]}">${esc(ct('ct.lv'))}: ${esc(lvTxt(c[0]))}</span><span class="leadbadge">${esc(ct('ct.lead.t'))}: <b>${esc(leadTxt(c[2]))}</b></span></div>
      <h4>${esc(ct('ct.certs'))}</h4><ul class="cr-list">${c[1].map(([id,t])=>certRow(id,t)).join('')}</ul>
      ${c[3]?`<div class="cd-note"><b>${esc(ct('ct.note'))}</b><p>${esc(L(c[3]))}</p></div>`:''}
      <div class="cd-actions"><button type="button" class="btn-line sm" data-go="country">${esc(ct('ct.country'))} →</button><button type="button" class="btn-line sm" data-go="ind">${esc(ct('ct.industry'))} →</button></div>`;
  } else if(kind==='country'){
    ic.textContent=m.code; h.textContent=L(m.name); sub.textContent=ct('ct.country');
    html=`<p class="cd-ov">${esc(L(m.ov))}</p>
      <div class="cd-note"><b>${esc(ct('ct.key'))}</b><ul>${L(m.key).map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div>
      ${m.links.length?`<div class="cd-links"><b>${esc(ct('ct.links'))}</b>${m.links.map(([a,u])=>extA(u,a+' ↗')).join('')}</div>`:''}
      <table class="cd-tbl"><tbody>${CIND.map(x=>{const c=CMAT[x.id][country]; return `<tr><th><button type="button" class="cd-row" data-ind="${x.id}" data-country="${country}">${esc(L(x.name))}</button></th><td><span class="lvdot lv${c[0]}" title="${esc(lvTxt(c[0]))}"></span></td><td>${cellCerts(c,4)}</td><td class="ld">${esc(leadTxt(c[2]))}</td></tr>`;}).join('')}</tbody></table>`;
  } else {
    ic.textContent='≡'; h.textContent=L(I.name); sub.textContent=ct('ct.industry');
    html=`<table class="cd-tbl"><tbody>${CMKT.map(x=>{const c=CMAT[ind][x.id]; return `<tr><th><button type="button" class="cd-row" data-ind="${ind}" data-country="${x.id}"><b>${x.code}</b> ${esc(L(x.name))}</button></th><td><span class="lvdot lv${c[0]}" title="${esc(lvTxt(c[0]))}"></span></td><td>${cellCerts(c,4)}</td><td class="ld">${esc(leadTxt(c[2]))}</td></tr>`;}).join('')}</tbody></table>`;
  }
  html+=`<div class="cd-foot">${certHist.length?`<button type="button" class="btn-line sm cd-back">← ${esc(ct('ct.back'))}</button>`:''}${extA(KNOWTBT,ct('ct.more')+' ↗','btn-line sm')}<a class="btn-line sm cd-ask" href="#contact">${esc(ct('ct.ask'))}</a></div><p class="comp-disc">${esc(ct('ct.disc'))}</p>`;
  body.innerHTML=html; body.scrollTop=0; certDlg.scrollTop=0;
  body.querySelectorAll('.cd-row').forEach(b=>b.addEventListener('click',()=>openCert('cell',b.dataset.ind,b.dataset.country)));
  body.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>openCert(b.dataset.go,b.dataset.go==='ind'?ind:null,b.dataset.go==='country'?country:null)));
  const back=body.querySelector('.cd-back'); if(back) back.addEventListener('click',()=>{ const s=certHist.pop(); openCert(s[0],s[1],s[2],false); });
  body.querySelector('.cd-ask').addEventListener('click',()=>certDlg.close());
  if(!certDlg.open) certDlg.showModal();
}
certDlg.querySelector('.close').addEventListener('click',()=>certDlg.close());
certDlg.addEventListener('click',e=>{ if(e.target===certDlg) certDlg.close(); });
certDlg.addEventListener('close',()=>{ certHist=[]; certState=null; });
function relabelCert(){ if(certDlg.open&&certState){ const s=certState; openCert(s[0],s[1],s[2],false); } }

document.querySelectorAll('#compliance .comp-tabs button').forEach(b=>b.addEventListener('click',()=>{ compTab=b.dataset.tab; renderComp(); }));
function goComp(tab){ compTab=tab; renderComp(); document.getElementById('compliance').scrollIntoView({behavior:'smooth'}); }
document.addEventListener('click',e=>{ const a=e.target.closest('a[href="#certs"],a[data-tool="sg"]'); if(!a) return; e.preventDefault(); if(typeof closeFab==='function') closeFab(); goComp(a.getAttribute('href')==='#certs'?'cert':'sg'); });
if(location.hash==='#certs') compTab='cert';
renderComp();

// ===== 방문자 카운터 + Cloudflare Web Analytics =====
const VT={ko:{today:'오늘 방문',total:'전체 방문'},en:{today:'Today',total:'Total visits'},ru:{today:'Сегодня',total:'Всего посещений'}};
let VISITS=null;
function renderVisits(){
  const el=document.getElementById('visitCount'); if(!el) return;
  if(!VISITS){ el.hidden=true; return; }
  const v=VT[LANG]||VT.ko, nf=new Intl.NumberFormat(LANG==='ru'?'ru-RU':LANG==='en'?'en-US':'ko-KR');
  el.innerHTML=`<span>${v.today} <b>${nf.format(VISITS.today)}</b></span><span>${v.total} <b>${nf.format(VISITS.total)}</b></span>`;
  el.hidden=false;
}
(async function(){
  // Cloudflare Web Analytics (토큰을 넣으면 자동으로 켜집니다)
  if(SITE_CONFIG.cfAnalyticsToken){
    const s=document.createElement('script'); s.defer=true; s.src='https://static.cloudflareinsights.com/beacon.min.js';
    s.setAttribute('data-cf-beacon',JSON.stringify({token:SITE_CONFIG.cfAnalyticsToken})); document.body.appendChild(s);
  }
  // 방문자 카운터 (Worker 주소를 넣으면 자동으로 켜집니다)
  if(!SITE_CONFIG.counterUrl) return;
  const day=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  let isNew=true; try{ isNew=localStorage.getItem('gawoo-visit')!==day; }catch(e){}
  try{
    const r=await fetch(SITE_CONFIG.counterUrl.replace(/\/$/,'')+'/hit'+(isNew?'?n=1':''),{cache:'no-store'});
    if(r.ok){ VISITS=await r.json(); try{ localStorage.setItem('gawoo-visit',day); }catch(e){} }
  }catch(e){}
  renderVisits();
})();
