name: Daily trade news

on:
  schedule:
    - cron: "50 20 * * *"   # 매일 05:50 (한국시간)
  workflow_dispatch:
    inputs:
      backfill:
        description: "지난 며칠치를 다시 모을까요? (0 = 오늘치만)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py data/news.json --backfill "${{ github.event.inputs.backfill || 0 }}"
      - name: Commit if changed
        run: |
          git config user.name "gawoo-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update trade news"
          git push
